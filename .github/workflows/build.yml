name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 first — only so the SDK manager (which now requires 17) can run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 33 (compileSdk) + 31 + build-tools
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-33" "build-tools;33.0.2" "platforms;android-31" "build-tools;31.0.0" >/dev/null

      # JDK 11 for the actual build (Gradle 7.1.1 + AGP 7.0.3 need 11, not 17)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # The 135 unit tests were never run by CI, so a commit - or a SIGNED RELEASE - could go out
      # with every one of them failing. They guard the state parsing, profile, scheduling and
      # widget work, which is exactly where the recent regressions were. Run them before the
      # build so a red suite stops the pipeline rather than shipping.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AccA-community-fix-debug
          path: app/build/outputs/apk/debug/*.apk

      # This workflow only validates that `main` builds. It no longer publishes a rolling
      # "dev" pre-release: only tagged versions are published, signed, via release.yml.
      # The debug APK is kept as a build artifact above for CI download.
